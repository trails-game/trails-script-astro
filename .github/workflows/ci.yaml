name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build Astro Starlight site for GitHub Pages
        env:
          ASTRO_SITE: https://trails-game.github.io
          ASTRO_BASE: /trails-script-astro
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy-oss:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build Astro Starlight site for Aliyun OSS
        run: npm run build

      - name: Precompress assets with Brotli for .htaccess
        run: |
          command -v brotli >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y brotli)
          find dist -type f \( -name "*.js" -o -name "*.css" -o -name "*.json" \) -exec brotli -q 9 -k {} +

      - name: Install ossutil v2
        run: |
          curl -fsSL "https://gosspublic.alicdn.com/ossutil/v2/2.4.1/ossutil-2.4.1-linux-amd64.zip" -o /tmp/ossutil.zip
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-bin
          sudo install -m 0755 /tmp/ossutil-bin/ossutil-2.4.1-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Sync artifacts to OSS
        env:
          AK_ID: ${{ secrets.ACCESS_ID }}
          AK_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          TARGET_BUCKET: ${{ secrets.BUCKET }}
        run: |
          (umask 077 && printf '[default]\naccessKeyID=%s\naccessKeySecret=%s\nregion=cn-hangzhou\nendpoint=oss-cn-hangzhou.aliyuncs.com\n' "$AK_ID" "$AK_SECRET" > ~/.ossutilconfig)
          TARGET_BUCKET="$(printf '%s' "$TARGET_BUCKET" | tr -d '[:space:]')"
          case "$TARGET_BUCKET" in
            oss://*) TARGET="$TARGET_BUCKET" ;;
            *) TARGET="oss://${TARGET_BUCKET#/}" ;;
          esac
          ossutil sync dist/ "$TARGET" --checksum --delete --job 10 -f
