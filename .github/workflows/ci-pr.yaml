name: PR Check
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build static site and search index
        run: npm run build
